name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      ConnectionStrings__MigrationConnection: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build backend/MiraiNote.sln --configuration Release
      - name: Test
        run: dotnet test backend/MiraiNote.Tests/MiraiNote.Tests.csproj --configuration Release --no-build
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Apply InitialPostgres to empty database
        run: dotnet ef database update --project backend/MiraiNote.Data --startup-project backend/MiraiNote.API --configuration Release
      - name: Idempotent migration script
        run: dotnet ef migrations script --idempotent --project backend/MiraiNote.Data --startup-project backend/MiraiNote.API --configuration Release --output ${{ runner.temp }}/initial-postgres.sql
      - uses: actions/upload-artifact@v4
        with:
          name: initial-postgres-sql
          path: ${{ runner.temp }}/initial-postgres.sql

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
